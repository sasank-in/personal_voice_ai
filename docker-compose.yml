# Optional: a project database, if you are not using a local PostgreSQL server.
# To use it, set DB_PORT=5433 and DB_PASSWORD=postgres in .env.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voice_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - voice_ai_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voice_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  voice_ai_db:
