server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Slightly above MAX_AUDIO_UPLOAD_MB, so the API gives the friendly error.
        client_max_body_size 22m;
        error_page 413 = @upload_too_large;
        # Matches the frontend's request timeout: a long reply takes time to speak.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location @upload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"file_too_large","message":"That upload is too large.","stage":"uploading","retryable":false}}';
    }

    # File names contain a content hash, so they can be cached forever.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
