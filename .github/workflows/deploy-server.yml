name: Deploy to server

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Add required reviewers to this environment in GitHub to approve each deployment by hand.
    environment: production
    env:
      SSH_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
      - name: Copy deployment files
        run: |
          ssh "$SSH_TARGET" "mkdir -p '$DEPLOY_PATH/deploy'"
          scp docker-compose.prod.yml "$SSH_TARGET:$DEPLOY_PATH/"
          scp deploy/Caddyfile "$SSH_TARGET:$DEPLOY_PATH/deploy/"
      - name: Log the server in to the image registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | ssh "$SSH_TARGET" "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
      - name: Start the new version
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          ssh "$SSH_TARGET" "cd '$DEPLOY_PATH' \
            && export IMAGE_PREFIX='$image_prefix' IMAGE_TAG='$IMAGE_TAG' \
            && docker compose -f docker-compose.prod.yml --env-file .env.production pull --quiet backend frontend \
            && docker compose -f docker-compose.prod.yml --env-file .env.production up -d --no-build --wait --wait-timeout 300 --remove-orphans"
      - name: Show logs on failure
        if: failure()
        run: ssh "$SSH_TARGET" "cd '$DEPLOY_PATH' && docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 100 backend frontend caddy" || true
      - name: Log the server out of the image registry
        if: always()
        run: ssh "$SSH_TARGET" "docker logout ghcr.io" || true
      - name: Check the live site
        env:
          SITE_URL: ${{ vars.DEPLOY_URL }}
        run: bash deploy/smoke-test.sh "$SITE_URL"
